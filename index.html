    function normalizeProductName(rawName) {
     return rawName.replace(/\s+/g," ").trim();
    }

    function fuzzyMatch(rawName, products) {
     const clean = rawName.replace(/\s+/g," ").trim();
     if (STATIC_ALIAS[clean]) return STATIC_ALIAS[clean];
     const noSpace = clean.replace(/\s/g,"");
     const candidates=[];
     products.forEach(p=>{
       candidates.push([p.name,p.name]);
       (Array.isArray(p.aliases)?p.aliases:[]).forEach(alias=>candidates.push([alias,p.name]));
     });
     for (const [k,v] of candidates) { if (normalizeProductName(k).replace(/\s/g,"")===noSpace) return v; }
     for (const [k,v] of Object.entries(STATIC_ALIAS)) { if (k.replace(/\s/g,"")===noSpace) return v; }
     for (const [k,v] of candidates) {
       const candidate=normalizeProductName(k);
       if (candidate.length>=2&&(clean.includes(candidate)||candidate.includes(clean))) return v;
     }
     for (const [k,v] of Object.entries(STATIC_ALIAS)) { if (clean.includes(k)||k.includes(clean)) return v; }
     if (clean.includes("왁뿌")||(clean.includes("망고")&&clean.includes("요거트"))) return "왁뿌 망고 요거트 시오";
     return null;
    }
    function exactProductMatch(rawName, products) {
     const clean=normalizeProductName(rawName);
     const noSpace=clean.replace(/\s/g,"");
     if (STATIC_ALIAS[clean]) return STATIC_ALIAS[clean];
     for (const p of products) {
       if (normalizeProductName(p.name).replace(/\s/g,"")===noSpace) return p.name;
       for (const alias of (Array.isArray(p.aliases)?p.aliases:[])) {
         if (normalizeProductName(alias).replace(/\s/g,"")===noSpace) return p.name;
       }
     }
     for (const [alias,name] of Object.entries(STATIC_ALIAS)) {
       if (alias.replace(/\s/g,"")===noSpace) return name;
     }
     return null;
    }

    function parseQty(raw) {
     if (/품절|소진|완판/.test(raw)) return 0;
     const nums = raw.replace(/개|진열/g,"").split("+").map(n=>parseInt(n)).filter(n=>!isNaN(n));
     if (!nums.length) return null;
     return nums.reduce((a,b)=>a+b,0);
    }

    function toDateStr(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
    function getDayLabel(s) { return DAYS[new Date(s+"T00:00:00").getDay()]; }
    function isWeekend(s) { const d=new Date(s+"T00:00:00").getDay(); return d===0||d===6; }
    function hasValidDemand(item) {
     return item&&Number.isFinite(item.stock)&&Number.isFinite(item.remaining)&&item.stock>=0&&item.remaining>=0&&item.remaining<=item.stock;
    }
    function excelDateToString(value) {
     if (value instanceof Date&&!isNaN(value)) return toDateStr(value);
     if (typeof value==="number"&&Number.isFinite(value)) {
       const parsed=window.XLSX.SSF.parse_date_code(value);
       if (parsed) return `${parsed.y}-${String(parsed.m).padStart(2,"0")}-${String(parsed.d).padStart(2,"0")}`;
     }
     const text=String(value??"").trim();
     let m=text.match(/^(\d{4})[-./년]\s*(\d{1,2})[-./월]\s*(\d{1,2})/);
     if (!m) m=text.match(/^(\d{1,2})[-./월]\s*(\d{1,2})/);
     if (!m) return null;
     const y=m.length===4?Number(m[1]):new Date().getFullYear();
     const month=m.length===4?Number(m[2]):Number(m[1]);
     const day=m.length===4?Number(m[3]):Number(m[2]);
     const result=`${y}-${String(month).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
     return isNaN(new Date(result+"T00:00:00").getTime())?null:result;
    }
    function parseExcelNumber(value) {
     if (value===null||value===undefined||String(value).trim()==="") return null;
     if (typeof value==="string"&&/품절|소진|완판/.test(value)) return 0;
     const n=Number(String(value).replace(/개|,/g,"").trim());
     return Number.isFinite(n)&&n>=0?n:null;
    }
    function parseInventoryWorkbook(file, cutoffDate, targetBranch, existingRecords, existingProducts) {
     return new Promise((resolve,reject)=>{
       const reader=new FileReader();
       reader.onerror=()=>reject(new Error("엑셀파일을 읽지 못했습니다."));
       reader.onload=e=>{
         try {
           const workbook=window.XLSX.read(e.target.result,{type:"array",cellDates:true});
           const sheet=workbook.Sheets["재고 데이터"]||workbook.Sheets[workbook.SheetNames[0]];
           if (!sheet) throw new Error("엑셀에서 데이터 시트를 찾지 못했습니다.");
           const rows=window.XLSX.utils.sheet_to_json(sheet,{header:1,defval:null,raw:true});
           const headerIndex=rows.findIndex(row=>row.some(v=>String(v??"").trim()==="날짜")&&row.some(v=>String(v??"").trim()==="상품명"));
           if (headerIndex<0) throw new Error("'날짜·상품명·오픈재고·잔여재고' 머리글을 찾지 못했습니다.");
           const headers=rows[headerIndex].map(v=>String(v??"").trim());
           const idx={date:headers.indexOf("날짜"),product:headers.indexOf("상품명"),stock:headers.indexOf("오픈재고"),remaining:headers.indexOf("잔여재고")};
           if (Object.values(idx).some(v=>v<0)) throw new Error("필수 열이 없습니다. 날짜, 상품명, 오픈재고, 잔여재고가 필요합니다.");
           const grouped=new Map();
           const productNames=new Set();
           const warnings=[];
           let sourceRows=0,excludedAfterCutoff=0,invalidRows=0,openMissing=0,closeMissing=0,zeroOpen=0,stockouts=0;
           rows.slice(headerIndex+1).forEach((row,offset)=>{
             const excelRow=headerIndex+2+offset;
             const recordDate=excelDateToString(row[idx.date]);
             const rawProduct=normalizeProductName(String(row[idx.product]??""));
             const product=rawProduct?(exactProductMatch(rawProduct,existingProducts)||rawProduct):"";
             if (!recordDate&&!rawProduct) return;
             if (!recordDate||!rawProduct) {invalidRows++;warnings.push(`${excelRow}행: 날짜 또는 상품명 누락`);return;}
             if (recordDate>cutoffDate) {excludedAfterCutoff++;return;}
             const stock=parseExcelNumber(row[idx.stock]);
             const remaining=parseExcelNumber(row[idx.remaining]);
             if (stock===null) openMissing++;
             if (remaining===null) closeMissing++;
             if (stock===0) zeroOpen++;
             if (stock!==null&&stock>0&&remaining===0) stockouts++;
             if (stock!==null&&remaining!==null&&remaining>stock) warnings.push(`${excelRow}행: ${product} 잔여재고가 오픈재고보다 큼`);
             if (!grouped.has(recordDate)) grouped.set(recordDate,{});
             grouped.get(recordDate)[product]={
               stock,
               remaining,
               stockout:stock!==null&&stock>0&&remaining===0,
               no_delivery:stock===0,
               missing_open:stock===null,
               missing_close:remaining===null
             };
             productNames.add(product); sourceRows++;
           });
           const existingKeys=new Set(existingRecords.map(r=>`${r.date}|||${r.branch}`));
           const allRecords=[...grouped.entries()].sort(([a],[b])=>a.localeCompare(b)).map(([recordDate,items])=>({
             date:recordDate,branch:targetBranch,items,
             remaining_source:"엑셀 일괄등록",remaining_time:null,is_estimated_close:false
           }));
           const skippedRecords=allRecords.filter(r=>existingKeys.has(`${r.date}|||${r.branch}`));
           const newRecords=allRecords.filter(r=>!existingKeys.has(`${r.date}|||${r.branch}`));
           resolve({fileName:file.name,sourceRows,excludedAfterCutoff,invalidRows,openMissing,closeMissing,zeroOpen,stockouts,
             allRecords,newRecords,skippedRecords,productNames:[...productNames].sort((a,b)=>a.localeCompare(b,"ko")),warnings});
         } catch(error) {reject(error);}
       };
       reader.readAsArrayBuffer(file);
     });
    }

    function parseKakao(text, products) {
     const lines = text.split("\n").map(l=>l.trim()).filter(Boolean);
     let date = toDateStr(new Date());
     for (const line of lines) {
       let m = line.match(/(\d{1,2})월\s*(\d{1,2})일/);
       if (!m) m = line.match(/(\d{1,2})[.\/\s]\s*(\d{1,2})/);
       if (m) { date=`${new Date().getFullYear()}-${String(m[1]).padStart(2,"0")}-${String(m[2]).padStart(2,"0")}`; break; }
     }
     const isEstimatedClose=/(17\s*시|17:00|오후\s*5\s*시)/.test(text);
     const isNormalClose=/마감/.test(text);
     const isOpen=/오픈|입고/.test(text);
     const type=(isNormalClose||isEstimatedClose)?"remaining":isOpen?"stock":null;
     const remainingSource=isEstimatedClose?"17시 재고":isNormalClose?"정상 마감":null;
     const remainingTime=isEstimatedClose?"17:00":null;
     const items={}, newProducts=[], invalid=[];
     for (const line of lines) {
       const m=line.match(/^(.+?)\s*\/\s*(.+)$/);
       if (!m) continue;
       const rawName=normalizeProductName(m[1]);
       const mapped=fuzzyMatch(rawName,products);
       const qty=parseQty(m[2].trim());
       if (!Number.isFinite(qty)) { invalid.push(rawName); continue; }
       const productName=mapped||rawName;
       if (!mapped&&!newProducts.includes(productName)) newProducts.push(productName);
       items[productName]=qty;
     }
     return {date,type,items,newProducts,invalid,isEstimatedClose,remainingSource,remainingTime,success:Boolean(type)&&Object.keys(items).length>0};
    }

    function calcRecommendation(records, targetDate, breadList) {
     const targetDay = new Date(targetDate+"T00:00:00").getDay();
     const targetIsWeekend = targetDay===0||targetDay===6;
     const sameDay = records
       .filter(r=>new Date(r.date+"T00:00:00").getDay()===targetDay)
       .sort((a,b)=>b.date.localeCompare(a.date))
       .slice(0,8);
     const recent4=sameDay.slice(0,4), older4=sameDay.slice(4,8);
     return breadList.map(bread=>{
       const r4=recent4.filter(r=>hasValidDemand(r.items?.[bread])&&r.items[bread].stock>0);
       const o4=older4.filter(r=>hasValidDemand(r.items?.[bread])&&r.items[bread].stock>0);
       if (!r4.length&&!o4.length) return {bread,qty:null,avgSold:null,hasSoldout:false};
       const avg4=r4.length>0?r4.reduce((s,r)=>s+(r.items[bread].stock-r.items[bread].remaining),0)/r4.length:null;
       const avgOld=o4.length>0?o4.reduce((s,r)=>s+(r.items[bread].stock-r.items[bread].remaining),0)/o4.length:null;
       let weightedAvg;
       if (avg4!==null&&avgOld!==null) weightedAvg=(avg4*2+avgOld)/3;
       else weightedAvg=avg4!==null?avg4:avgOld;
       const buffer=targetIsWeekend?1.15:1.10;
       const soldoutRate=r4.length>0?r4.filter(r=>r.items?.[bread]&&r.items[bread].remaining===0).length/r4.length:0;
       const final=Math.ceil(weightedAvg*buffer*(soldoutRate>=0.5?1.1:1));
       return {bread,qty:final,avgSold:Math.round(weightedAvg*10)/10,hasSoldout:soldoutRate>=0.5};
     });
    }

     const filtered = data.filter(b=>b.totalWaste>0);
     if (!filtered.length) return (
       <div style={{textAlign:"center",color:"#2E7D32",fontSize:13,padding:"12px 0"}}>🎉 {label} 악성재고 없음!</div>
     );
     return (
       <div>
         {filtered.map((b,i)=>(
           <div key={b.bread} style={{display:"flex",alignItems:"center",gap:8,marginBottom:9}}>
             <div style={{width:22,height:22,borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:700,flexShrink:0,
               background:i===0?"#C62828":i===1?"#E53935":i===2?"#EF5350":"#FFCDD2",color:i<3?"#fff":"#C62828"}}>{i+1}</div>
             <div style={{flex:1}}>
               <div style={{display:"flex",justifyContent:"space-between",marginBottom:3}}>
                 <span style={{fontSize:13}}>{b.bread}</span>
                 <span style={{fontSize:12}}>
                   <span style={{color:"#C62828",fontWeight:700}}>평균 {b.avgWaste}개 남음</span>
                   <span style={{color:"#888"}}> ({b.wasteRate}% 손실)</span>
                 </span>
               </div>
               <div style={{height:5,background:"#F0E4D4",borderRadius:3,overflow:"hidden"}}>
                 <div style={{height:"100%",width:`${Math.min((b.totalWaste/(filtered[0]?.totalWaste||1))*100,100)}%`,
                   background:b.wasteRate>=30?"#C62828":b.wasteRate>=15?"#FF7043":"#FFA726",borderRadius:3}}/>
               </div>
             </div>
           </div>
         ))}
       </div>
     );
    }

    function BakeryApp() {
     const [records, setRecords] = useState([]);
     const [products, setProducts] = useState([]);
     const [loading, setLoading] = useState(true);
     const [branch, setBranch] = useState(BRANCH_LIST[0]);
     const [tab, setTab] = useState("record");
     const [date, setDate] = useState(toDateStr(new Date()));
     const [inputs, setInputs] = useState({});
     const [saved, setSaved] = useState(false);
     const [showPaste, setShowPaste] = useState(false);
     const [showExcelImport, setShowExcelImport] = useState(false);
     const [excelBranch, setExcelBranch] = useState("하남 신세계");
     const [excelCutoff, setExcelCutoff] = useState("2026-07-31");
     const [excelPreview, setExcelPreview] = useState(null);
     const [excelError, setExcelError] = useState("");
     const [excelImporting, setExcelImporting] = useState(false);
     const [excelResult, setExcelResult] = useState(null);
     const [pasteText, setPasteText] = useState("");
     const [parseResult, setParseResult] = useState(null);
     const [parseError, setParseError] = useState("");
     const [statsTab, setStatsTab] = useState("sold");
     const [wasteTab, setWasteTab] = useState("weekday");
     const [showDeleteConfirm, setShowDeleteConfirm] = useState(false);
     const [recDate, setRecDate] = useState(toDateStr(new Date(Date.now()+86400000)));
     const [dbError, setDbError] = useState("");
     const [saving, setSaving] = useState(false);
     const BREAD_LIST = useMemo(()=>products.filter(p=>p.active!==false).map(p=>p.name),[products]);

     useEffect(()=>{
       let cancelled=false;
       Promise.all([loadData(),loadProducts()])
         .then(async ([d,p])=>{
           let productRows=p;
           if (!productRows.length) productRows=await registerProducts(DEFAULT_PRODUCTS);
           if(!cancelled){setRecords(d);setProducts(productRows);setDbError("");}
         })
         .catch(e=>{if(!cancelled)setDbError(`DB 연결 실패: ${e.message}`);})
         .finally(()=>{if(!cancelled)setLoading(false);});
       return ()=>{ cancelled=true; };
     },[]);

     useEffect(()=>{
       if (loading) return;
       const existing=records.find(r=>r.date===date && r.branch===branch);
       const obj={};
       BREAD_LIST.forEach(b=>{
         obj[b]=existing?.items?.[b]
           ?{stock:String(existing.items[b].stock??""),remaining:String(existing.items[b].remaining??"")}
           :{stock:"",remaining:""};
       });
       setInputs(obj); setSaved(false); setShowDeleteConfirm(false);
     },[date,branch,loading,BREAD_LIST,records]);

     function handleInput(bread,field,val){ setInputs(p=>({...p,[bread]:{...p[bread],[field]:val}})); }
     async function handleExcelFile(event) {
       const file=event.target.files?.[0];
       setExcelPreview(null);setExcelResult(null);setExcelError("");
       if (!file) return;
       try {
         const preview=await parseInventoryWorkbook(file,excelCutoff,excelBranch,records,products);
         if (!preview.allRecords.length) throw new Error("선택한 기간에 등록할 데이터가 없습니다.");
         setExcelPreview(preview);
       } catch(error) {setExcelError(error.message);}
       finally {event.target.value="";}
     }
     async function applyExcelImport() {
       if (!excelPreview||excelImporting) return;
       if (!excelPreview.newRecords.length) {setExcelResult({inserted:0,skipped:excelPreview.skippedRecords.length,newProducts:0});return;}
       const known=new Set(products.map(p=>p.name));
       const newNames=excelPreview.productNames.filter(name=>!known.has(name));
       if (!window.confirm(`${excelBranch}에 ${excelPreview.newRecords.length}일치 데이터를 등록합니다.\n기존 ${excelPreview.skippedRecords.length}일치는 건너뜁니다.\n\n계속할까요?`)) return;
       setExcelImporting(true);setExcelError("");setDbError("");
       try {
         let registered=[];
         if (newNames.length) registered=await registerProducts(newNames);
         await insertRecords(excelPreview.newRecords);
         if (registered.length) {
           setProducts(prev=>{
             const byName=new Map(prev.map(p=>[p.name,p]));
             registered.forEach(p=>byName.set(p.name,{...p,aliases:p.aliases||[],active:true}));
             return [...byName.values()].sort((a,b)=>a.name.localeCompare(b.name,"ko"));
           });
         }
         setRecords(prev=>[...prev,...excelPreview.newRecords].sort((a,b)=>a.date.localeCompare(b.date)||a.branch.localeCompare(b.branch,"ko")));
         setExcelResult({inserted:excelPreview.newRecords.length,skipped:excelPreview.skippedRecords.length,newProducts:newNames.length});
         setExcelPreview(null);
       } catch(error) {setExcelError(`일괄 등록 실패: ${error.message}`);}
       finally {setExcelImporting(false);}
     }
     async function handleSave(){
       const items={};
       BREAD_LIST.forEach(b=>{
         const s=parseInt(inputs[b]?.stock), r=parseInt(inputs[b]?.remaining);
         if (!isNaN(s)&&!isNaN(r)) items[b]={stock:s,remaining:r};
       });
       const record={date,branch,items,remaining_source:"직접 입력",remaining_time:null,is_estimated_close:false};
       setSaving(true); setDbError("");
       try {
         await upsertRecord(record);
         const updated=[...records.filter(r=>!(r.date===date && r.branch===branch)),record].sort((a,b)=>a.date.localeCompare(b.date));
         setRecords(updated); setSaved(true); setTimeout(()=>setSaved(false),2000);
       } catch(e) { setDbError(`저장 실패: ${e.message}`); }
       finally { setSaving(false); }
     }

     async function handleDelete(){
       setSaving(true); setDbError("");
       try {
         await deleteRecord(date,branch);
         const updated=records.filter(r=>!(r.date===date && r.branch===branch));
         setRecords(updated);
         const obj={}; BREAD_LIST.forEach(b=>{obj[b]={stock:"",remaining:""}}); setInputs(obj); setShowDeleteConfirm(false); setSaved(false);
       } catch(e) { setDbError(`삭제 실패: ${e.message}`); }
       finally { setSaving(false); }
     }

     function handleParse(){
       setParseError(""); setParseResult(null);
       if (!pasteText.trim()) return;
       const result=parseKakao(pasteText,products);
       if (!result.type){setParseError("보고 유형을 확인하지 못했어요. 메시지에 '오픈', '마감', '17시', '17:00' 또는 '오후 5시'가 포함되어야 해요."); return;}
       if (!result.success){setParseError("품목을 찾지 못했어요. '품목명 / 수량개' 형식인지 확인해주세요."); return;}
       setParseResult(result);
     }

     async function applyResult(){
       if (!parseResult) return;
       const {date:d,type,items,newProducts=[],isEstimatedClose,remainingSource,remainingTime}=parseResult;
       if (isEstimatedClose&&!window.confirm("17시 재고 보고입니다.\n\n마감재고 대체값으로 저장할까요?\n17시 이후 판매량은 반영되지 않습니다.")) return;
       if (newProducts.length&&!window.confirm(`새로운 상품 ${newProducts.length}개가 발견됐어요.\n\n${newProducts.join("\n")}\n\n상품 목록에 등록하고 계속할까요?`)) return;
       const existing=records.find(r=>r.date===d && r.branch===branch);
       const newItems={...(existing?.items||{})};
       Object.entries(items).forEach(([bread,qty])=>{
         if (!newItems[bread]) newItems[bread]={stock:0,remaining:0};
         if (type==="stock") newItems[bread].stock=qty; else newItems[bread].remaining=qty;
       });
       const record={
         date:d,branch,items:newItems,
         remaining_source:type==="remaining"?remainingSource:(existing?.remaining_source||null),
         remaining_time:type==="remaining"?remainingTime:(existing?.remaining_time||null),
         is_estimated_close:type==="remaining"?Boolean(isEstimatedClose):Boolean(existing?.is_estimated_close)
       };
       setSaving(true); setDbError("");
       try {
         let activeBreadList=BREAD_LIST;
         if (newProducts.length) {
           const registered=await registerProducts(newProducts);
           setProducts(prev=>{
             const byName=new Map(prev.map(p=>[p.name,p]));
             registered.forEach(p=>byName.set(p.name,{...p,aliases:p.aliases||[],active:true}));
             return [...byName.values()].sort((a,b)=>a.name.localeCompare(b.name,"ko"));
           });
           activeBreadList=[...new Set([...BREAD_LIST,...newProducts])];
         }
         await upsertRecord(record);
         const updated=[...records.filter(r=>!(r.date===d && r.branch===branch)),record].sort((a,b)=>a.date.localeCompare(b.date));
         setRecords(updated); setDate(d);
         const obj={};
         activeBreadList.forEach(b=>{obj[b]=newItems[b]?{stock:String(newItems[b].stock??""),remaining:String(newItems[b].remaining??"")}:{stock:"",remaining:""}}); setInputs(obj); setShowPaste(false); setPasteText(""); setParseResult(null);
         setSaved(true); setTimeout(()=>setSaved(false),2000);
       } catch(e) { setDbError(`저장 실패: ${e.message}`); }
       finally { setSaving(false); }
     }

     const currentRecord = records.find(r=>r.date===date && r.branch===branch);
     const hasRecord = Boolean(currentRecord);
     const filteredRecords = useMemo(()=>branch===ALL_BRANCHES?records:records.filter(r=>r.branch===branch),[records,branch]);
     const hasEnoughData = filteredRecords.length>=7;

     const soldRanking = useMemo(()=>BREAD_LIST.map(bread=>{
       const rel=filteredRecords.filter(r=>hasValidDemand(r.items?.[bread])&&r.items[bread].stock>0);
       if (!rel.length) return {bread,totalSold:0,avgSold:0};
       const totalSold=rel.reduce((s,r)=>s+(r.items[bread].stock-r.items[bread].remaining),0);
       return {bread,totalSold,avgSold:Math.round(totalSold/rel.length*10)/10};
     }).sort((a,b)=>b.totalSold-a.totalSold),[filteredRecords,BREAD_LIST]);

     const wasteByType = useMemo(()=>{
       const calc=(fn)=>BREAD_LIST.map(bread=>{
         const rel=filteredRecords.filter(r=>hasValidDemand(r.items?.[bread])&&r.items[bread].stock>0&&fn(r.date));
         if (!rel.length) return {bread,totalWaste:0,avgWaste:0,wasteRate:0};
         const totalWaste=rel.reduce((s,r)=>s+r.items[bread].remaining,0);
         const totalStock=rel.reduce((s,r)=>s+r.items[bread].stock,0);
         return {bread,totalWaste,avgWaste:Math.round(totalWaste/rel.length*10)/10,
           wasteRate:totalStock>0?Math.round((totalWaste/totalStock)*100):0};
       }).sort((a,b)=>b.totalWaste-a.totalWaste);
       return {weekday:calc(d=>!isWeekend(d)),weekend:calc(d=>isWeekend(d))};
     },[filteredRecords,BREAD_LIST]);

     const soldoutRanking = useMemo(()=>BREAD_LIST.map(bread=>{
       const rel=filteredRecords.filter(r=>hasValidDemand(r.items?.[bread])&&r.items[bread].stock>0);
       if (!rel.length) return {bread,soldoutCount:0,soldoutRate:0,wkdCount:0,wkeCount:0,total:0};
       const so=rel.filter(r=>r.items[bread].remaining===0);
       return {bread,soldoutCount:so.length,soldoutRate:Math.round((so.length/rel.length)*100),
         wkdCount:so.filter(r=>!isWeekend(r.date)).length,
         wkeCount:so.filter(r=>isWeekend(r.date)).length,total:rel.length};
     }).filter(b=>b.soldoutCount>0).sort((a,b)=>b.soldoutRate-a.soldoutRate),[filteredRecords,BREAD_LIST]);

     const weekdayStats = useMemo(()=>{
       const wkd={},wke={};
       BREAD_LIST.forEach(b=>{wkd[b]={sold:0,count:0};wke[b]={sold:0,count:0}});
       filteredRecords.forEach(r=>{
         const wknd=isWeekend(r.date);
         Object.entries(r.items||{}).forEach(([bread,it])=>{
           if (!wkd[bread]||!wke[bread]||!hasValidDemand(it)||it.stock===0) return;
           const sold=it.stock-it.remaining;
           if (wknd){wke[bread].sold+=sold;wke[bread].count++;}
           else{wkd[bread].sold+=sold;wkd[bread].count++;}
         });
       });
       return BREAD_LIST.map(bread=>({
         bread,
         weekdayAvg:wkd[bread].count>0?Math.round(wkd[bread].sold/wkd[bread].count*10)/10:0,
         weekendAvg:wke[bread].count>0?Math.round(wke[bread].sold/wke[bread].count*10)/10:0,
       })).sort((a,b)=>(b.weekdayAvg+b.weekendAvg)-(a.weekdayAvg+a.weekendAvg));
     },[filteredRecords,BREAD_LIST]);

     const recentTrend = useMemo(()=>filteredRecords.slice(-14).map(r=>{
       let sold=0; Object.values(r.items||{}).forEach(it=>{if(hasValidDemand(it)&&it.stock>0)sold+=it.stock-it.remaining});
       return {date:r.date.slice(5),총판매:sold,type:isWeekend(r.date)?"주말":"평일"};
     }),[filteredRecords]);

     const recommendation = useMemo(()=>calcRecommendation(filteredRecords,recDate,BREAD_LIST),[filteredRecords,recDate,BREAD_LIST]);

     const S={
       card:{background:"#fff",borderRadius:12,padding:16,marginBottom:14,boxShadow:"0 1px 6px rgba(0,0,0,0.07)"},
       tab:a=>({flex:1,padding:"11px 4px",border:"none",background:"none",color:a?"#8B4513":"#888",fontWeight:a?700:400,fontSize:13,cursor:"pointer",borderBottom:a?"3px solid #8B4513":"3px solid transparent"}),
       sub:a=>({flex:1,padding:"7px 4px",border:"none",background:a?"#8B4513":"#F5EDE0",color:a?"#fff":"#8B4513",fontWeight:a?700:500,fontSize:11,cursor:"pointer",borderRadius:6}),
       btn:d=>({width:"100%",padding:"13px",background:d?"#CCC":"linear-gradient(135deg,#8B4513,#C27A3A)",color:"#fff",border:"none",borderRadius:10,fontWeight:700,fontSize:15,cursor:d?"not-allowed":"pointer"}),
     };

     if (loading) {
       return (
         <div style={{fontFamily:"'Noto Sans KR',sans-serif",background:"#FDF6EE",minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",color:"#8B4513",fontWeight:600}}>
           불러오는 중...
         </div>
       );
     }

     return (
       <div style={{fontFamily:"'Noto Sans KR',sans-serif",background:"#FDF6EE",minHeight:"100vh"}}>
         <div style={{background:"linear-gradient(135deg,#8B4513 0%,#C27A3A 100%)",color:"#fff",padding:"18px 20px 14px"}}>
           <div style={{fontSize:21,fontWeight:700}}>🍞 시오사쿠 재고관리</div>
           <div style={{fontSize:12,opacity:0.85,marginTop:2}}>전체 {records.length}건 저장됨 · {branch===ALL_BRANCHES?"전체 지점 통합 보기":`${branch} ${filteredRecords.length}일치`}</div>
           <div style={{marginTop:10}}>
             <select value={branch} onChange={e=>{setBranch(e.target.value);setShowPaste(false);setShowExcelImport(false);setParseResult(null);}}
               style={{width:"100%",padding:"9px 10px",borderRadius:8,border:"none",fontSize:14,fontWeight:700,color:"#5C3317",background:"#FFF6EA"}}>
               {BRANCH_LIST.map(b=><option key={b} value={b}>{b}</option>)}
               <option value={ALL_BRANCHES}>📊 {ALL_BRANCHES} (통합 보기)</option>
             </select>
           </div>
         </div>
         <div style={{display:"flex",background:"#fff",borderBottom:"2px solid #F0E4D4"}}>
           {[["record","📋 재고 기록"],["stats","📊 판매 분석"],["rec","🧮 생산량 추천"]].map(([k,l])=>(
             <button key={k} onClick={()=>setTab(k)} style={S.tab(tab===k)}>{l}</button>
           ))}
         </div>
         <div style={{padding:"16px 14px",maxWidth:700,margin:"0 auto"}}>
           {dbError && (
             <div style={{background:"#FFF0F0",border:"1px solid #EF9A9A",color:"#C62828",padding:"10px 12px",borderRadius:8,marginBottom:12,fontSize:13}}>
               ⚠️ {dbError}<br/><span style={{fontSize:11}}>Supabase에서 테이블 생성 SQL을 먼저 실행했는지 확인해주세요.</span>
             </div>
           )}
           {/* 재고 기록 */}
           {tab==="record" && branch===ALL_BRANCHES && (
             <div style={{textAlign:"center",padding:"60px 20px",color:"#A08060"}}>
               <div style={{fontSize:48}}>🏬</div>
               <div style={{marginTop:12,fontWeight:600}}>기록할 지점을 선택해주세요</div>
               <div style={{fontSize:13,marginTop:6}}>"전체 지점"에서는 통합 통계만 볼 수 있어요</div>
             </div>
           )}
           {tab==="record" && branch!==ALL_BRANCHES && (
             <div>
               <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:12,flexWrap:"wrap"}}>
                 <label style={{fontWeight:600,color:"#5C3317",fontSize:14}}>날짜</label>
                 <input type="date" value={date} onChange={e=>setDate(e.target.value)}
                   style={{border:"1.5px solid #D4A97A",borderRadius:8,padding:"6px 10px",fontSize:14,color:"#5C3317"}}/>
                 <span style={{fontSize:12,color:"#A08060"}}>({getDayLabel(date)}요일)</span>
                 <div style={{marginLeft:"auto",display:"flex",gap:6}}>
                   <button onClick={()=>{setShowPaste(!showPaste);setShowExcelImport(false);setParseResult(null);setParseError("")}}
                     style={{padding:"7px 12px",background:showPaste?"#8B4513":"#FDF0E4",color:showPaste?"#fff":"#8B4513",border:"1.5px solid #C27A3A",borderRadius:8,fontSize:13,fontWeight:600,cursor:"pointer"}}>
                     💬 단톡
                   </button>
                   <button onClick={()=>{setShowExcelImport(!showExcelImport);setShowPaste(false);setExcelPreview(null);setExcelError("");setExcelResult(null)}}
                     style={{padding:"7px 12px",background:showExcelImport?"#2E7D32":"#F0FFF4",color:showExcelImport?"#fff":"#2E7D32",border:"1.5px solid #66BB6A",borderRadius:8,fontSize:13,fontWeight:600,cursor:"pointer"}}>
                     엑셀
                   </button>
                   {hasRecord && (
                     <button onClick={()=>setShowDeleteConfirm(true)}
                       style={{padding:"7px 12px",background:"#FFF0F0",color:"#C62828",border:"1.5px solid #EF9A9A",borderRadius:8,fontSize:13,fontWeight:600,cursor:"pointer"}}>
                       🗑️ 삭제
                     </button>
                   )}
                 </div>
               </div>

               {currentRecord?.is_estimated_close && (
                 <div style={{background:"#FFF3E0",border:"1px solid #FFB74D",color:"#E65100",padding:"9px 12px",borderRadius:8,marginBottom:12,fontSize:12}}>
                   ⚠️ 이 날짜의 잔여재고는 {currentRecord.remaining_time?.slice(0,5)||"17:00"} 기준 마감 대체자료입니다. 이후 판매량은 반영되지 않았습니다.
                 </div>
               )}

               {showDeleteConfirm && (
                 <div style={{...S.card,border:"2px solid #EF9A9A",background:"#FFF8F8"}}>
                   <div style={{fontWeight:700,color:"#C62828",marginBottom:6,fontSize:14}}>🗑️ {date} 기록을 삭제할까요?</div>
                   <div style={{fontSize:13,color:"#888",marginBottom:12}}>삭제하면 복구가 안 돼요!</div>
                   <div style={{display:"flex",gap:8}}>
                     <button onClick={handleDelete} style={{flex:1,padding:"10px",background:"#C62828",color:"#fff",border:"none",borderRadius:8,fontWeight:700,fontSize:14,cursor:"pointer"}}>네, 삭제할게요</button>
                     <button onClick={()=>setShowDeleteConfirm(false)} style={{flex:1,padding:"10px",background:"#F5F5F5",color:"#555",border:"none",borderRadius:8,fontWeight:700,fontSize:14,cursor:"pointer"}}>취소</button>
                   </div>
                 </div>
               )}

               {showExcelImport && (
                 <div style={{...S.card,border:"2px solid #81C784",background:"#FBFFFC"}}>
                   <div style={{fontWeight:700,color:"#1B5E20",marginBottom:4,fontSize:14}}>엑셀 일괄 등록</div>
                   <div style={{fontSize:12,color:"#558B2F",marginBottom:12}}>기존 날짜는 덮어쓰지 않고 자동으로 건너뜁니다.</div>
                   <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:10}}>
                     <label style={{fontSize:12,color:"#5C3317"}}>등록 지점
                       <select value={excelBranch} onChange={e=>{setExcelBranch(e.target.value);setExcelPreview(null);setExcelResult(null)}}
                         style={{display:"block",width:"100%",marginTop:4,padding:"8px",border:"1px solid #A5D6A7",borderRadius:7,background:"#fff"}}>
                         {BRANCH_LIST.map(b=><option key={b} value={b}>{b}</option>)}
                       </select>
                     </label>
                     <label style={{fontSize:12,color:"#5C3317"}}>마지막 등록 날짜
                       <input type="date" value={excelCutoff} onChange={e=>{setExcelCutoff(e.target.value);setExcelPreview(null);setExcelResult(null)}}
                         style={{display:"block",width:"100%",boxSizing:"border-box",marginTop:4,padding:"7px",border:"1px solid #A5D6A7",borderRadius:7,background:"#fff"}}/>
                     </label>
                   </div>
                   <label style={{display:"block",padding:"12px",border:"2px dashed #81C784",borderRadius:8,textAlign:"center",color:"#2E7D32",fontSize:13,fontWeight:600,cursor:"pointer",background:"#F1F8E9"}}>
                     엑셀파일 선택
                     <input type="file" accept=".xlsx,.xls" onChange={handleExcelFile} style={{display:"none"}}/>
                   </label>
                   {excelError && <div style={{marginTop:10,color:"#C62828",fontSize:12,background:"#FFF0F0",padding:"9px 10px",borderRadius:7}}>⚠️ {excelError}</div>}
                   {excelPreview && (
                     <div style={{marginTop:12,border:"1px solid #A5D6A7",borderRadius:8,padding:12,background:"#fff"}}>
                       <div style={{fontWeight:700,color:"#2E7D32",fontSize:13,marginBottom:8}}>{excelPreview.fileName}</div>
                       <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"5px 12px",fontSize:12,color:"#555"}}>
                         <div>품목 행 <b>{excelPreview.sourceRows}개</b></div>
                         <div>대상 날짜 <b>{excelPreview.allRecords.length}일</b></div>
                         <div style={{color:"#2E7D32"}}>새로 등록 <b>{excelPreview.newRecords.length}일</b></div>
                         <div style={{color:"#F57C00"}}>기존 날짜 건너뜀 <b>{excelPreview.skippedRecords.length}일</b></div>
                         <div>신규 포함 품목 <b>{excelPreview.productNames.length}종</b></div>
                         <div>기간 이후 제외 <b>{excelPreview.excludedAfterCutoff}행</b></div>
                         <div>오픈 공란 <b>{excelPreview.openMissing}행</b></div>
                         <div>마감 공란 <b>{excelPreview.closeMissing}행</b></div>
                         <div>미입고(오픈 0) <b>{excelPreview.zeroOpen}행</b></div>
                         <div>품절 기록 <b>{excelPreview.stockouts}행</b></div>
                       </div>
                       {excelPreview.warnings.length>0 && (
                         <div style={{marginTop:8,fontSize:11,color:"#E65100",background:"#FFF3E0",padding:"7px 9px",borderRadius:6}}>
                           검토 필요 {excelPreview.warnings.length}건: {excelPreview.warnings.slice(0,3).join(" · ")}{excelPreview.warnings.length>3?" 외":""}
                         </div>
                       )}
                       <button onClick={applyExcelImport} disabled={excelImporting||!excelPreview.newRecords.length}
                         style={{...S.btn(excelImporting||!excelPreview.newRecords.length),marginTop:10,padding:"11px",fontSize:14}}>
                         {excelImporting?"등록 중...":excelPreview.newRecords.length?`${excelPreview.newRecords.length}일치 Supabase에 등록`:"새로 등록할 날짜 없음"}
                       </button>
                     </div>
                   )}
                   {excelResult && (
                     <div style={{marginTop:10,color:"#1B5E20",fontSize:12,background:"#E8F5E9",padding:"10px",borderRadius:7}}>
                       등록 완료: {excelResult.inserted}일 · 기존 날짜 건너뜀: {excelResult.skipped}일 · 신규 상품: {excelResult.newProducts}종
                     </div>
                   )}
                 </div>
               )}

               {showPaste && (
                 <div style={{...S.card,border:"2px solid #D4A97A"}}>
                   <div style={{fontWeight:700,color:"#5C3317",marginBottom:4,fontSize:14}}>💬 카카오톡 메시지 붙여넣기</div>
                   <div style={{fontSize:12,color:"#C27A3A",marginBottom:10}}>✓ 40+20개→60개 자동계산 &nbsp;✓ 품절→0개 &nbsp;✓ 처음 보는 상품은 확인 후 자동등록</div>
                   <textarea value={pasteText} onChange={e=>setPasteText(e.target.value)}
                     placeholder={"06 03 오픈\n오사카 시오빵 / 40개+20개\n왁뿌 망고 요거트 시오빵 / 12개+1개\n메론 산도 / 품절"}
                     style={{width:"100%",height:130,padding:10,border:"1.5px solid #D4A97A",borderRadius:8,fontSize:13,resize:"vertical",boxSizing:"border-box",fontFamily:"inherit",lineHeight:1.6}}/>
                   <button onClick={handleParse} disabled={!pasteText.trim()} style={{...S.btn(!pasteText.trim()),marginTop:8,padding:"11px",fontSize:14}}>📋 자동으로 채우기</button>
                   {parseError && <div style={{marginTop:10,color:"#C62828",fontSize:13,background:"#FFF0F0",padding:"8px 12px",borderRadius:8}}>⚠️ {parseError}</div>}
                   {parseResult && (
                     <div style={{marginTop:12,background:"#F0FFF4",borderRadius:8,padding:12,border:"1px solid #A5D6A7"}}>
                       <div style={{fontWeight:700,color:"#2E7D32",marginBottom:8,fontSize:13}}>
                         ✅ {parseResult.date} ({getDayLabel(parseResult.date)}요일) — {parseResult.type==="stock"?"오픈 입고":parseResult.isEstimatedClose?"17시 재고(마감 대체)":"마감 잔여"} {Object.keys(parseResult.items).length}개 품목
                       </div>
                       {parseResult.isEstimatedClose && (
                         <div style={{marginBottom:8,fontSize:12,color:"#E65100",background:"#FFF3E0",padding:"8px 10px",borderRadius:6}}>
                           ⚠️ 17시 이후 판매량이 빠질 수 있어 정상 마감자료와 구분하여 저장됩니다.
                         </div>
                       )}
                       {Object.entries(parseResult.items).map(([bread,qty])=>(
                         <div key={bread} style={{display:"flex",justifyContent:"space-between",fontSize:13,padding:"4px 0",borderBottom:"1px solid #C8E6C9"}}>
                           <span>{bread}</span>
                           <span style={{fontWeight:600,color:qty===0?"#C62828":"#2E7D32"}}>{qty===0?"품절(0개)":`${qty}개`}</span>
                         </div>
                       ))}
                       {parseResult.newProducts?.length>0 && (
                         <div style={{marginTop:8,fontSize:12,color:"#1565C0",background:"#E3F2FD",padding:"8px 10px",borderRadius:6}}>
                           🆕 새 상품: {parseResult.newProducts.join(", ")}<br/>적용할 때 상품 목록 등록 여부를 확인합니다.
                         </div>
                       )}
                       {parseResult.invalid?.length>0 && (
                         <div style={{marginTop:8,fontSize:12,color:"#E65100",background:"#FFF3E0",padding:"6px 10px",borderRadius:6}}>⚠️ 수량을 읽지 못한 품목: {parseResult.invalid.join(", ")}</div>
                       )}
                       <button onClick={applyResult} style={{...S.btn(false),marginTop:10,padding:"10px",fontSize:14}}>✅ {parseResult.newProducts?.length?"새 상품 등록 후 적용":"적용하기"}</button>
                     </div>
                   )}
                 </div>
               )}

               <div style={{display:"grid",gridTemplateColumns:"1fr 90px 90px 65px",gap:6,padding:"8px 10px",background:"#C27A3A",borderRadius:"10px 10px 0 0",color:"#fff",fontWeight:600,fontSize:13}}>
                 <div>빵 이름</div><div style={{textAlign:"center"}}>입고</div><div style={{textAlign:"center"}}>잔여</div><div style={{textAlign:"center"}}>판매율</div>
               </div>
               {BREAD_LIST.length===0 && <div style={{padding:18,textAlign:"center",color:"#A08060",background:"#fff"}}>등록된 상품이 없습니다. 단톡 메시지를 붙여넣어 첫 상품을 등록해주세요.</div>}
               {BREAD_LIST.map((bread,i)=>{
                 const s=parseInt(inputs[bread]?.stock),r=parseInt(inputs[bread]?.remaining);
                 const sold=(!isNaN(s)&&!isNaN(r))?s-r:null;
                 const rate=(sold!==null&&s>0)?Math.round((sold/s)*100):null;
                 return (
                   <div key={bread} style={{display:"grid",gridTemplateColumns:"1fr 90px 90px 65px",gap:6,padding:"8px 10px",alignItems:"center",background:i%2===0?"#fff":"#FDF0E4",border:"1px solid #EDD8BF",borderTop:"none"}}>
                     <div style={{fontWeight:500,color:"#5C3317",fontSize:12,lineHeight:1.4}}>{bread}</div>
                     <input type="number" min="0" placeholder="0" value={inputs[bread]?.stock??""} onChange={e=>handleInput(bread,"stock",e.target.value)}
                       style={{width:"100%",padding:"5px 4px",border:"1.5px solid #D4A97A",borderRadius:6,fontSize:14,textAlign:"center",background:"#FFFAF5",boxSizing:"border-box"}}/>
                     <input type="number" min="0" placeholder="0" value={inputs[bread]?.remaining??""} onChange={e=>handleInput(bread,"remaining",e.target.value)}
                       style={{width:"100%",padding:"5px 4px",border:"1.5px solid #D4A97A",borderRadius:6,fontSize:14,textAlign:"center",background:"#FFFAF5",boxSizing:"border-box"}}/>
                     <div style={{textAlign:"center",fontWeight:700,fontSize:13,color:rate===null?"#CCC":rate>=80?"#2E7D32":rate>=50?"#F57C00":"#C62828"}}>
                       {rate!==null?`${rate}%`:"-"}
                     </div>
                   </div>
                 );
               })}
               <button onClick={handleSave} disabled={saving}
                 style={{width:"100%",marginTop:14,padding:"13px",background:saved?"#4CAF50":saving?"#AAA":"linear-gradient(135deg,#8B4513,#C27A3A)",color:"#fff",border:"none",borderRadius:10,fontWeight:700,fontSize:16,cursor:saving?"not-allowed":"pointer"}}>
                 {saving?"저장 중...":saved?"✅ 저장 완료!":"💾 오늘 기록 저장"}
               </button>
             </div>
           )}

           {/* stats 탭 */}
           {tab==="stats" && (
             <div>
                {records.length<2 ? (
                  <div style={{textAlign:"center",padding:"60px 20px",color:"#A08060"}}>
                    <div style={{fontSize:48}}>📊</div>
                    <div style={{marginTop:12,fontWeight:600}}>아직 데이터가 부족해요</div>
                    <div style={{fontSize:13,marginTop:6}}>2일 이상 기록하면 분석이 시작됩니다</div>
                  </div>
                ) : (
                  <div style={S.card}>
                     <div style={{fontWeight:700,color:"#5C3317",marginBottom:12,fontSize:14}}>🥇 빵별 총 판매수량 순위</div>
                     {soldRanking.filter(b=>b.totalSold>0).map((b,i)=>(
                       <div key={b.bread} style={{display:"flex",alignItems:"center",gap:8,marginBottom:9}}>
                         <div style={{width:22,height:22,borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:700,flexShrink:0,
                           background:i===0?"#FFD700":i===1?"#C0C0C0":i===2?"#CD7F32":"#EDD8BF",color:i<3?"#fff":"#8B6040"}}>{i+1}</div>
                         <div style={{flex:1}}>
                           <div style={{display:"flex",justifyContent:"space-between",marginBottom:3}}>
                             <span style={{fontSize:13}}>{b.bread}</span>
                             <span style={{fontSize:12,color:"#888"}}>총 {b.totalSold}개 &nbsp;<span style={{fontWeight:700,color:"#8B4513"}}>평균 {b.avgSold}개/일</span></span>
                           </div>
                           <div style={{height:5,background:"#F0E4D4",borderRadius:3,overflow:"hidden"}}>
                             <div style={{height:"100%",width:`${Math.min((b.totalSold/(soldRanking[0]?.totalSold||1))*100,100)}%`,background:"#C27A3A",borderRadius:3}}/>
                           </div>
                         </div>
                       </div>
                     ))}
                  </div>
                )}
             </div>
           )}

           {/* rec 탭 */}
           {tab==="rec" && (
             <div style={S.card}>
                <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:12,flexWrap:"wrap"}}>
                  <div style={{fontWeight:700,color:"#5C3317",fontSize:15}}>🧮 생산량 추천</div>
                  <div style={{marginLeft:"auto",display:"flex",alignItems:"center",gap:6}}>
                    <input type="date" value={recDate} onChange={e=>setRecDate(e.target.value)}
                      style={{border:"1.5px solid #D4A97A",borderRadius:8,padding:"6px 10px",fontSize:13,color:"#5C3317"}}/>
                    <span style={{fontSize:12,color:"#A08060"}}>({getDayLabel(recDate)}요일)</span>
                  </div>
                </div>
                {!hasEnoughData ? (
                  <div style={{background:"#FFF8E1",borderRadius:10,padding:"14px 16px",border:"1px solid #FFE082"}}>
                    <div style={{fontWeight:700,color:"#F57C00",marginBottom:4,fontSize:14}}>⏳ 데이터를 더 쌓아주세요</div>
                    <div style={{fontSize:13,color:"#795548"}}>7일 이상 기록이 누적되어야 정밀 추천 시스템이 가동됩니다. (현재 {records.length}일 기록됨)</div>
                  </div>
                ) : (
                  (() => {
                    const withData = recommendation.filter(r=>r.qty!==null);
                    const withoutData = recommendation.filter(r=>r.qty===null);
                    if (!withData.length) {
                      return (
                        <div style={{background:"#FFF8E1",borderRadius:10,padding:"14px 16px",border:"1px solid #FFE082"}}>
                          <div style={{fontWeight:700,color:"#F57C00",marginBottom:4,fontSize:14}}>⏳ {getDayLabel(recDate)}요일 데이터가 부족해요</div>
                          <div style={{fontSize:13,color:"#795548"}}>해당 요일 기록이 아직 없어서 추천을 계산할 수 없어요.</div>
                        </div>
                      );
                    }
                    return (
                      <div>
                        <div style={{fontSize:12,color:"#A08060",marginBottom:10}}>최근 {getDayLabel(recDate)}요일 판매 실적 기반 · 품절 이력이 있는 품목은 여유분을 더 반영했어요</div>
                        {withData.sort((a,b)=>b.qty-a.qty).map(r=>(
                          <div key={r.bread} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"10px 12px",background:"#FDF0E4",borderRadius:8,marginBottom:6}}>
                            <div>
                              <div style={{fontSize:13,fontWeight:600,color:"#5C3317"}}>
                                {r.bread}
                                {r.hasSoldout && <span style={{marginLeft:6,fontSize:11,color:"#C62828",background:"#FFF0F0",padding:"2px 6px",borderRadius:6}}>품절 잦음</span>}
                              </div>
                              <div style={{fontSize:11,color:"#A08060",marginTop:2}}>평균 판매 {r.avgSold}개</div>
                            </div>
                            <div style={{fontSize:20,fontWeight:700,color:"#8B4513"}}>{r.qty}개</div>
                          </div>
                        ))}
                        {withoutData.length>0 && (
                          <div style={{marginTop:12,fontSize:12,color:"#A08060"}}>
                            아직 {getDayLabel(recDate)}요일 기록이 없는 품목: {withoutData.map(r=>r.bread).join(", ")}
                          </div>
                        )}
                      </div>
                    );
                  })()
                )}
             </div>
           )}
         </div>
       </div>
     );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<BakeryApp />);
  </script>
</body>
</html>
